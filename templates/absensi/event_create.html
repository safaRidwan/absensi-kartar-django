{% extends 'absensi/base.html' %}
{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>#event-map { height: 260px; border-radius: 12px; z-index: 1; }</style>
{% endblock %}

{% block content %}
<div class="card mb-4 shadow-sm border-0">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold text-primary">Buat Kegiatan Baru</h5>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-sm btn-outline-secondary rounded-pill">Kembali</a>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3"><label class="form-label fw-bold small">NAMA KEGIATAN</label><input type="text" class="form-control" name="title" required></div>
            <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label fw-bold small">WAKTU MULAI</label><input type="datetime-local" class="form-control" name="start_time" required></div>
                <div class="col-md-6 mb-3"><label class="form-label fw-bold small">WAKTU SELESAI</label><input type="datetime-local" class="form-control" name="end_time" required></div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="form-label fw-bold small mb-0">TITIK LOKASI & RADIUS</label>
                    <button type="button" class="btn btn-sm btn-outline-info rounded-pill" onclick="ambilLokasiSaya()"><i class="bx bx-current-location"></i> Lokasi Saya</button>
                </div>
                <div id="event-map" class="mb-2 border"></div>
                <small class="text-muted d-block mb-2">Klik pada peta atau geser pin biru untuk menentukan titik pusat absensi.</small>
                <div class="row g-2">
                    <div class="col-4"><input type="text" class="form-control form-control-sm" name="lat" id="lat" value="-7.54418483" required></div>
                    <div class="col-4"><input type="text" class="form-control form-control-sm" name="lon" id="lon" value="110.75789168" required></div>
                    <div class="col-4">
                        <div class="input-group input-group-sm">
                            <input type="number" class="form-control" name="tolerance" id="tolerance" value="50" min="5" required>
                            <span class="input-group-text">m</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" name="is_active" id="isActive" checked>
                <label class="form-check-label fw-bold" for="isActive">Aktifkan Kegiatan (Kirim Notif Telegram)</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">Simpan Kegiatan</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const latInput = document.getElementById('lat');
const lonInput = document.getElementById('lon');
const radInput = document.getElementById('tolerance');

const initLat = parseFloat(latInput.value);
const initLon = parseFloat(lonInput.value);

const map = L.map('event-map').setView([initLat, initLon], 17);
L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 20,
    subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
    attribution: '© Google Maps'
}).addTo(map);

const marker = L.marker([initLat, initLon], { draggable: true }).addTo(map);
const circle = L.circle([initLat, initLon], { color: '#696cff', fillColor: '#696cff', fillOpacity: 0.2, radius: parseInt(radInput.value) }).addTo(map);

function updatePosisi(lat, lon) {
    latInput.value = lat.toFixed(8);
    lonInput.value = lon.toFixed(8);
    marker.setLatLng([lat, lon]);
    circle.setLatLng([lat, lon]);
}

map.on('click', (e) => updatePosisi(e.latlng.lat, e.latlng.lng));
marker.on('dragend', () => {
    const pos = marker.getLatLng();
    updatePosisi(pos.lat, pos.lng);
});
radInput.addEventListener('input', () => circle.setRadius(parseInt(radInput.value) || 10));

function ambilLokasiSaya() {
    navigator.geolocation.getCurrentPosition((pos) => {
        updatePosisi(pos.coords.latitude, pos.coords.longitude);
        map.setView([pos.coords.latitude, pos.coords.longitude], 18);
    }, () => alert("Gagal mengambil GPS."));
}
</script>
{% endblock %}
